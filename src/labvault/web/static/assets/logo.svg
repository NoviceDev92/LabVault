<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="lv-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="lv-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="lv-grad-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1" />
    </linearGradient>
    <filter id="lv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Isometric Cube -->
  <!-- Top Face -->
  <polygon points="24,4 42,14 24,24 6,14" fill="url(#lv-grad-glow)" stroke="#6366F1" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Left Face -->
  <polygon points="6,14 24,24 24,44 6,34" fill="#0F172A" stroke="#4F46E5" stroke-width="1.5" stroke-linejoin="round" opacity="0.9" />
  <!-- Right Face -->
  <polygon points="24,24 42,14 42,34 24,44" fill="#1E293B" stroke="#6366F1" stroke-width="1.5" stroke-linejoin="round" opacity="0.9" />

  <!-- Inner Vault Lock & Neural Node (Cyan core) -->
  <circle cx="24" cy="24" r="5" fill="url(#lv-grad-cyan)" filter="url(#lv-glow)" />
  <circle cx="24" cy="24" r="2" fill="#FFFFFF" />

  <!-- Radiating Vault Lattice Nodes -->
  <line x1="24" y1="19" x2="24" y2="11" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="24" cy="10" r="1.5" fill="#22D3EE" />

  <line x1="19" y1="26" x2="13" y2="30" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="12" cy="30.5" r="1.5" fill="#818CF8" />

  <line x1="29" y1="26" x2="35" y2="30" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="36" cy="30.5" r="1.5" fill="#818CF8" />
</svg>
